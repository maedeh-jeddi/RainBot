# Nav2 parameters for the pickplace_arm 4-wheel skid-steer mobile base.
# Robot footprint is the chassis rectangle itself, as a four-vertex polygon:
# bumper +0.494, tail -0.496, half-width 0.335 (inscribed 0.335, circumscribed
# 0.598). It was a 0.34 m circle -- the INSCRIBED radius of the real A200
# (0.9874 x 0.5709 m body, wheels reaching y +/-0.3347) -- which modelled the
# width honestly and the length not at all; see the local costmap below. Uses the
# MPPI controller with the DiffDrive motion model, and the Smac 2D global
# planner. SLAM (slam_toolbox) supplies map -> odom for the single-robot
# launches; the hospital fleet runs AMCL instead (config/amcl_hospital.yaml).

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_drive_controller/odom
    plugin_lib_names:
      - nav2_assisted_teleop_action_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_back_up_action_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_controller_selector_bt_node
      - nav2_distance_controller_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_get_pose_from_path_action_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_planner_selector_bt_node
      - nav2_progress_checker_selector_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_single_trigger_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_speed_controller_bt_node
      - nav2_spin_action_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_wait_cancel_bt_node
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    odom_topic: /diff_drive_controller/odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # SIZED FOR THE LAST HALF METRE, NOT THE FIRST FORTY. SimpleProgressChecker
    # aborts unless the robot covers required_movement_radius within
    # movement_time_allowance, and at 0.5 m / 10 s that is a demand a robot
    # doing its final approach CANNOT meet: it is already inside 0.25 m of the
    # goal, so there is not 0.5 m left to travel. Measured with MPPI driving,
    # r2 sat 0.25 m off the delivery standoff nudging itself in and was aborted
    # 43 times in a row, while r1 and r3 -- neither of which had reached the
    # table yet -- tripped it zero times.
    #
    # RPP hid this because it drove the last stretch at speed and either hit the
    # tolerance or gave up; MPPI converges gradually, which is what makes it
    # better at docking and what makes the old threshold wrong. 0.10 m over 20 s
    # still catches a genuinely wedged robot -- one that is stuck moves nothing
    # at all -- without punishing one that is merely being careful.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # 0.35, up from 0.20. THIS TOLERANCE IS COMPARED AGAINST AMCL'S ESTIMATE,
      # NOT AGAINST THE WORLD, and that is the whole reason it has to be this
      # loose. Measured with r3 parked at the delivery standoff:
      #
      #     true pose     (-3.485, 10.988)   0.049 m from the goal
      #     AMCL estimate (-3.225, 11.024)   0.275 m from the goal
      #
      # The robot had arrived -- 5 cm out, heading within 0.012 rad -- and the
      # goal checker refused it, because AMCL's own 0.26 m residual put its
      # believed position just outside a 0.25 m circle. MPPI then nudged at the
      # goal line until the progress checker aborted, three times over, while
      # the robot sat still. A tolerance tighter than the localisation error is
      # not a precision setting, it is a deadlock.
      #
      # 0.26 m is ordinary for AMCL and not a defect to tune away, so the
      # tolerance accommodates it. Nothing downstream needs 20 cm anyway: at a
      # collection table claw_approach visually servos onto the rack from
      # wherever the robot stopped, and at the delivery table place_in_slot
      # re-reads the slot and calls _close_in_on when it is out of arm's reach.
      #
      # BACK TO 0.35 AFTER A SPELL AT 0.15, AND THE 0.15 IS WHAT THE PARAGRAPH
      # ABOVE PREDICTS. Measured on the three-robot run, r1 at collect_0:
      #
      #     goal          (-8.900, -3.516)
      #     true pose     (-8.796, -3.443)   0.128 m from the goal
      #     AMCL estimate (-8.743, -3.544)   0.159 m from the goal
      #
      # i.e. the robot was parked at its collection standoff, square to the
      # table, with the rack 1.3 m dead ahead -- and the goal checker refused it
      # by NINE MILLIMETRES. MPPI then nudged at the goal line, the progress
      # checker aborted it every 20 s, the Spin recovery was refused with
      # "Collision Ahead" (collect_0's bay is the tight one), and 120 s later
      # the mission's own nav timeout fired. run_errand treats a timed-out
      # approach as "could not reach the collection table", so the errand
      # retried the identical goal and deadlocked the identical way: rack_red
      # was still sitting untouched on its table at the end of the run while
      # r2 and r3 -- whose filters happened to land inside 0.15 -- both
      # collected and delivered normally. It reads as "the red robot never
      # picks up its rack"; it is really "whichever robot's AMCL residual
      # exceeds the tolerance never arrives".
      #
      # mission_delivery.STANDOFF_ARRIVED_TOL is written against this number in
      # so many words ("Nav2's own xy_goal_tolerance is 0.35 and AMCL carries
      # ~0.15 on top"), so tightening it here also silently desynchronised the
      # only check that verifies an arrival in the MAP frame.
      xy_goal_tolerance: 0.35
      # Loose heading tolerance: the robot doesn't need to nail an exact final
      # yaw (the visual servo re-centres on the box, and delivery/parking don't
      # care which way it faces). A tight yaw made the skid-steer oscillate in
      # place around the goal heading, which tripped Nav2's recovery Spin.
      #
      # THIS IS THE DEFAULT, NOT THE APPROACH VALUE. Where an accurate arrival
      # heading actually matters -- the collection table, the columns, the
      # delivery standoff -- the mission tightens it to TIGHT_YAW_TOLERANCE
      # (0.20) for that one goal and puts it back afterwards, via
      # Mission2._set_yaw_goal_tolerance. So pinning 0.1 here bought the
      # approaches nothing they were not already asking for, and charged every
      # other goal in the run for it.
      yaw_goal_tolerance: 0.5

    # MPPI, NOT RegulatedPurePursuit. RPP follows a path; it does not choose
    # one. It has a single collision check along the carrot and its only
    # response to an obstacle is to slow down and eventually give up, which is
    # why obstacle handling in this fleet has been "Nav2 aborts, the mission
    # retries". MPPI rolls out a batch of candidate trajectories every cycle and
    # scores them against the costmap, so avoiding something is an ordinary
    # outcome of control rather than a failure of it -- and it stays that way
    # when the dynamic obstacles arrive, which RPP would not.
    #
    # SIZED FOR THREE ROBOTS ON ONE MACHINE. The defaults are batch_size 2000
    # and time_steps 56, and three of those at 20 Hz is not affordable here --
    # this fleet has already lost whole missions to nav2_lifecycle_manager
    # missing 2 s deadlines under load.
    #
    # BATCH IS 600, DOWN FROM 1000, AND THE HORIZON IS DELIBERATELY UNTOUCHED.
    # These two numbers cost the same per sample but do NOT buy the same thing.
    # batch_size buys how densely the control space is sampled; time_steps buys
    # how far ahead a sample looks. Only the second one is a safety property, so
    # when the base got faster (0.55 -> 0.70 below) the horizon had to stay:
    # 36 x 0.05 x 0.70 = 1.26 m of lookahead, still comfortably past the 0.65 m
    # inflation radius, so the controller sees an obstacle inflated to its full
    # cost before it is committed to reaching it.
    #
    # Cutting the batch instead is the cheap half. This is the single largest
    # ROS-side consumer on this machine -- 1000 x 36 x 20 Hz x 3 robots is 2.16
    # million trajectory points a second through eight critics -- and 600 takes
    # that to 1.30 million. MPPI degrades gracefully in this direction: fewer
    # samples means a slightly noisier optimum, not a blind one, and the
    # softmax over 600 samples at temperature 0.3 is still averaging over a
    # wide set. If paths start looking jittery rather than merely imperfect,
    # this is the number to put back first.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 22, DOWN FROM 36, AND THIS IS THE PARAMETER THAT ACTUALLY SETS CRUISING
      # SPEED. vx_max does not.
      #
      # MEASURED, on the running fleet with vx_max already raised to 0.90:
      #
      #     r1  cmd_vel  max |vx| 0.567   mean 0.552
      #     r2  cmd_vel  max |vx| 0.564   mean 0.546
      #     r3  cmd_vel  max |vx| 0.570   mean 0.557
      #
      # Three robots in three different parts of the building, all pinned at
      # 0.55, with `ros2 param get` confirming vx_max=0.9 was loaded. A ceiling
      # that identical is not an optimiser finding an optimum, it is a
      # constraint -- and it is this one.
      #
      # MPPI scores where a rollout ENDS, not how fast it went. PathFollowCritic
      # penalises the distance from the last trajectory point to a carrot a
      # bounded distance along the path, so the speed that minimises cost is
      # roughly (carrot distance) / (horizon). With 36 x 0.05 = 1.80 s of
      # horizon and a carrot about 0.99 m out, that is 0.55 m/s exactly. Raising
      # vx_max lifts a ceiling the optimiser was never touching.
      #
      # SHORTENING THE HORIZON WAS TRIED AND IT DID NOT WORK, which is worth
      # recording because it is the obvious first guess. At 22 steps the fleet
      # measured max 0.542 m/s against 0.567 before: the ROLLOUT LENGTH changed
      # (1.02 m to 0.60 m) and the speed did not. That rules the carrot out and
      # is what pointed at gamma and temperature below, which turned out to be
      # the real constraint.
      #
      # So this is back near where it was, at 30. It buys lookahead and nothing
      # else was ever paying for: 30 x 0.05 x 0.90 = 1.35 m, against a 0.65 m
      # inflation radius, so an obstacle reaches full cost well before the
      # controller is committed to it. 36 was the old value at 0.70 m/s; 30 at
      # 0.90 m/s covers more ground per rollout than 36 did, and costs 17% less
      # in the largest ROS-side consumer on this machine (600 samples x steps x
      # 20 Hz x 3 robots).
      time_steps: 30
      model_dt: 0.05
      batch_size: 600
      iteration_count: 1
      # vy is pinned to zero and stays there: this is a skid-steer, and the
      # DiffDrive motion model is what makes MPPI stop proposing sideways
      # motion it cannot execute.
      motion_model: "DiffDrive"
      # 0.25, up from 0.2. This is how far above the current command the
      # sampler looks. It has to be wide enough to reach vx_max from cruise or
      # the optimiser can never discover that faster is cheaper.
      vx_std: 0.25
      vy_std: 0.0
      wz_std: 0.4
      # 0.90 m/s, UP FROM 0.70, AND THE CEILING IS THE HARDWARE'S 1.00.
      #
      # The 0.80 that used to cap this was diff_drive_controller's limit, not
      # the A200's: Clearpath's own hardware interface declares max_speed 1.0
      # (a200.urdf.xacro), so 0.80 was self-imposed. It is now 1.00 in
      # arm_controllers.yaml and this asks for 0.90 of it. The routes to the
      # collection tables are 29-40 m and there are six such legs in a mission,
      # so a 41-57 s drive becomes 32-44 s.
      #
      # NOT 1.00. Leaving 0.10 m/s under the limiter matters: at the ceiling the
      # controller's acceleration limit clips MPPI's command on every cycle
      # where it asks to speed up, and a clipped command is one the optimiser
      # did not plan for. Headroom keeps commanded and executed velocity the
      # same thing.
      #
      # THE HORIZON STILL COVERS IT, which is the safety property the note above
      # about batch_size versus time_steps exists to protect:
      # 36 x 0.05 x 0.90 = 1.62 m of lookahead against a 0.65 m inflation
      # radius, so an obstacle reaches full cost well before the controller is
      # committed to driving into it. That margin is why the horizon was left
      # alone to pay for this.
      vx_max: 0.90
      # -0.45. Reversing is how MPPI gets out of the way of another robot in a
      # corridor too narrow to swing in, and it can now do it at the same rate
      # it backs off a wall.
      vx_min: -0.45
      vy_max: 0.0
      # 2.2 rad/s against the controller's 2.5, for the same headroom reason.
      # Faster in place turning matters more than it looks: every errand ends
      # with the base squaring up to a table, and the mission's own servo loops
      # turn in place whenever the target is off centre but already in reach.
      wz_max: 2.2
      # 2.8, UP FROM 2.0, AND THE NOTE THAT SET THE 2.0 IS WHY.
      #
      # It says: "the path handed to the critics has to extend past both the
      # rollout and the carrot PathFollowCritic aims at, or the carrot clamps to
      # the end of the path and the speed it implies collapses again." That was
      # right, and 2.0 satisfied it for the rollout it was written against
      # (0.99 m). It does not satisfy it any more. Working the numbers for what
      # this file now asks for:
      #
      #     rollout at vx_max   time_steps 30 x model_dt 0.05 x 0.90 = 1.35 m
      #     carrot              + offset_from_furthest 10 x 0.05     = 1.85 m
      #     path handed over    prune_distance                         2.00 m
      #                                                        margin   0.15 m
      #
      # 0.15 m of margin on a path made of 0.05 m points, around any curve, is
      # no margin: the carrot sits on the last point or two of the pruned path
      # for most of a corridor, which is exactly the clamp the note warns about.
      # And the fleet's measured cruise says so -- ground truth over a whole
      # mission, three robots, sampled every 2 s:
      #
      #     r1  51.8 m of path   0.46 m/s      r2  66.1 m   0.52 m/s
      #     r3  75.9 m of path   0.54 m/s      against vx_max 0.90
      #
      # i.e. still the same ~0.55 m/s ceiling the temperature and gamma notes
      # above were chasing, with those two already fixed.
      #
      # 2.8 gives 0.95 m of margin instead of 0.15. It is not larger because
      # the LOCAL COSTMAP is what really bounds this: nav2_mppi's path handler
      # takes the smaller of prune_distance and the costmap's own half extent,
      # and the local costmap is 6 x 6 m rolling, so 3.0 m is the ceiling and
      # anything past it is a number that does nothing. 2.8 stays under it.
      prune_distance: 2.8
      transform_tolerance: 0.2
      # temperature 0.15 and gamma 0.005, FROM 0.3 AND 0.015, AND THESE TWO ARE
      # WHY THE FLEET CRUISED AT 0.55 m/s WITH vx_max SET TO 0.90.
      #
      # Measured, three robots, with `ros2 param get` confirming vx_max=0.9 was
      # loaded and Nav2's own optimizer.cpp confirming the only clamp on the
      # control sequence is vx_max itself:
      #
      #     before                    max 0.567   mean 0.552
      #     after halving the horizon max 0.542   <- unchanged
      #
      # Halving the prediction horizon changed the ROLLOUT LENGTH (1.02 m to
      # 0.60 m) and left the speed alone, which rules out the carrot being the
      # binding constraint. What was left is MPPI's own cost, and two terms in
      # it price speed directly:
      #
      #   gamma      the control cost, gamma / vx_std^2 * sum(u . noise). It
      #              scales with |u|, so it is literally a charge for asking for
      #              a large velocity. Nav2 documents it as the smoothness
      #              versus low-energy trade-off; 0.015 is its default and buys
      #              smoothness this fleet does not need at the price of speed.
      #
      #   temperature  how greedily the softmax picks the best sample. At 0.3
      #              the update is an average over a wide band of candidates, so
      #              even when the fastest ones are cheapest the mean lands well
      #              below them. 0.15 makes the optimiser commit to what it
      #              found.
      #
      # THESE TRADE SMOOTHNESS, NOT SAFETY. The obstacle terms are untouched, so
      # what gets rougher is the velocity profile, not the clearance. If the
      # base starts hunting or the ride looks jerky, raise temperature back
      # first -- it is the one that changes character rather than magnitude.
      temperature: 0.15
      gamma: 0.005
      regenerate_noises: false
      # Off deliberately: publishing candidate trajectories is a per-cycle
      # marker array per robot, and nothing reads it in a headless run.
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # CostCritic rather than ObstaclesCritic: it reads the costmap's own
      # inflation gradient, so the robot is pushed away from obstacles
      # continuously instead of only when a footprint check trips.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true #false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      # LEFT AT 14.0. Dropping it to 8.0 was tried as a speed fix on the theory
      # that a faster rollout deviates more from a curved path; measured, the
      # fleet still capped at 0.542 m/s, so it was not paying for anything and
      # the change was reverted rather than kept on a hunch. Path tracking is
      # what this weight is for.
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        # 10, up from 5. This is the carrot the note on time_steps above is
        # about: the critic aims the END of each rollout at the path point this
        # many indices beyond the furthest one any rollout reached. Smac 2D
        # emits points at the 0.05 m costmap resolution, so 5 was a carrot about
        # a quarter of a metre past where the robot already expected to be, and
        # a near carrot asks for a low speed. Doubling it asks for a further one.
        offset_from_furthest: 10
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      # 10 Hz and 6 m square, up from 5 Hz and 4 m. MPPI rolls out a ~1 m
      # horizon 20 times a second and scores it against THIS grid, so a window
      # that only refreshes every 200 ms is the limiting factor on how late an
      # obstacle can appear and still be avoided. 6 m leaves margin around the
      # rollouts at the window edge; 120x120 cells is cheap.
      # 15 Hz, up from 10, MATCHED TO THE LIDAR'S NEW 15 Hz. The point of
      # raising the scan rate is lower latency between an obstacle existing and
      # the controller being able to see it, and a costmap that only refreshes
      # at 10 Hz throws a third of those scans away. MPPI reads this grid 20
      # times a second; at 15 Hz the grid is never more than 67 ms stale, which
      # at the raised 0.90 m/s closing speed is 6 cm rather than 9.
      update_frequency: 15.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # 0.34, UP FROM 0.25, AND THE OLD VALUE WAS SMALLER THAN THE ROBOT.
      #
      # 0.25 was inherited from the placeholder chassis this project started on
      # (0.38 x 0.26 m). The A200 is 0.9874 x 0.5709 m and its wheels reach
      # y +/-0.3347, so a 0.25 m circle is not an approximation of it, it is a
      # different and smaller robot: the costmap's INSCRIBED zone - the band a
      # planner refuses to enter - sat 0.085 m INSIDE the robot's own flanks, so
      # a path that grazed a wall scored as clear. That is half of why obstacle
      # avoidance was not working; the other half was the LIDAR scanning over
      # the top of everything.
      #
      # 0.34 is the honest inscribed radius (half width plus the wheel bulge).
      # The robot is still under-modelled lengthwise, where it reaches 0.4937
      # fore and aft, which a circular footprint cannot express; the 0.65 m
      # inflation and MPPI's 1.62 m rollout horizon carry that end, and a true
      # rectangle would cost every doorway in the building.
      #
      # CHECKED, NOT ASSUMED, against the regenerated map: a distance transform
      # of the free space keeps reception, all three collection standoffs and
      # the delivery standoff mutually reachable at radii up to 0.40 m. The
      # binding one is the delivery standoff, 0.45 m from the table's cells, so
      # 0.34 leaves 0.11 m and stays plannable where 0.45 would not.
      # FOUR CORNERS OF THE ACTUAL CHASSIS, not a circle through them.
      # base_link sits at the chassis origin: bumper +0.494, tail -0.496,
      # half-width 0.335. Same rectangle as ROBOT_FOOTPRINT in fleet_layout.py,
      # which is the source of truth -- change it there and here together.
      # Listed counter-clockwise from the front right corner.
      #
      # WHAT THIS BUYS over robot_radius: the 0.34 circle was the INSCRIBED
      # radius, so it modelled the width honestly and the length not at all --
      # the robot reaches 0.4937 fore and aft and the circle simply did not know
      # that. A polygon expresses both, so a plan that swings the tail into a
      # wall is now a collision instead of a clearance.
      #
      # WHAT IT COSTS, AND IT IS NOT FREE. The old comment here argued a true
      # rectangle "would cost every doorway in the building", and the same
      # distance-transform check it cited found the delivery standoff to be the
      # binding constraint at 0.45 m from the table's cells. The inscribed
      # radius is essentially unchanged -- 0.335 against 0.34 -- so head-on
      # clearance is the same, but the corners now sweep to 0.598 when the base
      # rotates. Watch the delivery standoff and the doorways on the first run.
      footprint: "[[0.494, -0.335], [0.494, 0.335], [-0.496, 0.335], [-0.496, -0.335]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.45, up from 0.30. This is what gives Smac 2D's cost_travel_multiplier
        # and MPPI's CostCritic a gradient to work with -- at 0.30 the cost fell
        # to zero almost as soon as the robot cleared the obstacle, so "keep
        # clear of the wall" was not expressible.
        #
        # RAISING IT DOES NOT ENDANGER THE TIGHT STANDOFFS, which is the obvious
        # worry: what a planner refuses to enter is the INSCRIBED zone, and that
        # is set by the footprint's inscribed radius (0.335), not by this.
        # Beyond 0.335 m inflation
        # only adds cost. The delivery standoff sits 0.70 m from the table's
        # lethal cells and stays traversable; measured on the running stack, the
        # cost there is 0.
        # LEFT AT 0.65. Cutting it to 0.50 was tried as a speed fix, on the
        # theory that a LIDAR which now sees the furniture leaves the robot
        # permanently inside inflated cost that CostCritic charges it for.
        # Measured, the fleet still capped at 0.542 m/s, so the halo was not
        # what was slowing it down -- and clearance around the furniture the
        # lowered scanner can finally see is the whole point of that scanner.
        # Reverted rather than kept.
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # The same four corners the local costmap uses -- see there for why this
      # is a polygon and no longer a 0.34 m circle.
      footprint: "[[0.494, -0.335], [0.494, 0.335], [-0.496, 0.335], [-0.496, -0.335]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.45, up from 0.30. This is what gives Smac 2D's cost_travel_multiplier
        # and MPPI's CostCritic a gradient to work with -- at 0.30 the cost fell
        # to zero almost as soon as the robot cleared the obstacle, so "keep
        # clear of the wall" was not expressible.
        #
        # RAISING IT DOES NOT ENDANGER THE TIGHT STANDOFFS, which is the obvious
        # worry: what a planner refuses to enter is the INSCRIBED zone, and that
        # is set by the footprint's inscribed radius (0.335), not by this.
        # Beyond 0.335 m inflation
        # only adds cost. The delivery standoff sits 0.70 m from the table's
        # lethal cells and stays traversable; measured on the running stack, the
        # cost there is 0.
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    # 5.0, matching what Smac 2D actually achieves on a 540x1160 costmap
    # (measured: 4.5 Hz). This is only the threshold for the 'planner loop
    # missed its rate' warning -- the behaviour tree replans at 1 Hz -- so
    # the old 20.0 bought nothing but a warning per plan.
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    # SmacPlanner2D, not NavFn. Both are grid planners and either can express
    # a differential-drive route -- a robot that turns in place has no
    # kinematic constraint for a planner to respect, which is also why the
    # Hybrid-A* and State Lattice planners are the wrong tools here: they exist
    # to honour a turning radius this robot does not have, and they cost
    # considerably more to run.
    #
    # What Smac 2D adds over NavFn is cost_travel_multiplier: it prices travel
    # through inflated cells, so the route keeps clearance from walls and
    # tables instead of shaving them the way NavFn's pure shortest path does.
    # That is the half of obstacle avoidance the controller cannot fix, because
    # by the time MPPI sees a path hugging a doorway its only options are all
    # bad ones.
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# THIS BLOCK IS NOT LOADED BY ANYTHING. hospital_fleet.launch.py's NAV_NODES
# list is [controller_server, smoother_server, planner_server, behavior_server,
# bt_navigator] -- smoother_server is the PATH smoother, not this -- so no
# velocity_smoother process exists in this system and these numbers have never
# taken effect. The real command chain is:
#
#     MPPI  ->  /<ns>/cmd_vel  ->  twist_mux  ->  diff_drive_controller
#
# so the limits that actually bind are FollowPath's vx_max/wz_max above and
# diff_drive_controller's own velocity AND ACCELERATION limits in
# arm_controllers.yaml. It is kept, matched to those, so that adding the node
# later does not silently clip commands the controller planned -- but do not
# tune here expecting the robot to change.
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Raised in step with MPPI's vx_max/wz_max above and with
    # diff_drive_controller's limits in arm_controllers.yaml. This smoother sits
    # BETWEEN the two, so it must never be the narrowest of the three or it
    # silently clips commands the controller planned and the base could execute:
    #     MPPI      0.90 / 2.2      what is asked for
    #     smoother  0.90 / 2.4      what is passed on   <- here
    #     hardware  1.00 / 2.5      what is possible
    #
    # THE ACCELERATION IS THE HALF THAT ACTUALLY SHOWS. A mission is not one
    # long straight run, it is six legs each of which starts, stops, and squares
    # up to a table, plus every slow-down MPPI makes for an obstacle. At
    # 1.5 m/s^2 reaching 0.90 m/s takes 0.60 s and 0.27 m; at 2.5 it takes
    # 0.36 s and 0.16 m. Traction is nowhere near the limit - the wheels carry
    # mu 1.0 in pickplace_arm.gazebo.xacro, i.e. about 9.8 m/s^2 before slip -
    # so what bounds this is that a skid-steer which slips corrupts its own
    # odometry, and 2.5 is a quarter of the traction limit.
    #
    # IT ALSO IMPROVES TRACKING RATHER THAN COSTING IT. MPPI's motion model has
    # no acceleration term, so it plans as though velocity changes instantly;
    # every ramp this smoother imposes is error between the planned trajectory
    # and the driven one. A shorter ramp is a smaller lie.
    max_velocity: [0.9, 0.0, 2.4]
    min_velocity: [-0.9, 0.0, -2.4]
    max_accel: [2.5, 0.0, 6.0]
    max_decel: [-2.5, 0.0, -6.0]
    odom_topic: "/diff_drive_controller/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
