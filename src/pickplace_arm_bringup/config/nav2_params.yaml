# Nav2 parameters for the pickplace_arm 4-wheel skid-steer mobile base.
# Robot footprint approximated as a 0.25 m radius circle (covers the
# 0.38x0.26 m chassis plus the wheels that protrude past it). Uses the
# MPPI controller with the DiffDrive motion model, and the Smac 2D global
# planner. SLAM (slam_toolbox) supplies map -> odom for the single-robot
# launches; the hospital fleet runs AMCL instead (config/amcl_hospital.yaml).

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_drive_controller/odom
    plugin_lib_names:
      - nav2_assisted_teleop_action_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_back_up_action_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_controller_selector_bt_node
      - nav2_distance_controller_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_get_pose_from_path_action_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_planner_selector_bt_node
      - nav2_progress_checker_selector_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_single_trigger_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_speed_controller_bt_node
      - nav2_spin_action_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_wait_cancel_bt_node
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    odom_topic: /diff_drive_controller/odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # SIZED FOR THE LAST HALF METRE, NOT THE FIRST FORTY. SimpleProgressChecker
    # aborts unless the robot covers required_movement_radius within
    # movement_time_allowance, and at 0.5 m / 10 s that is a demand a robot
    # doing its final approach CANNOT meet: it is already inside 0.25 m of the
    # goal, so there is not 0.5 m left to travel. Measured with MPPI driving,
    # r2 sat 0.25 m off the delivery standoff nudging itself in and was aborted
    # 43 times in a row, while r1 and r3 -- neither of which had reached the
    # table yet -- tripped it zero times.
    #
    # RPP hid this because it drove the last stretch at speed and either hit the
    # tolerance or gave up; MPPI converges gradually, which is what makes it
    # better at docking and what makes the old threshold wrong. 0.10 m over 20 s
    # still catches a genuinely wedged robot -- one that is stuck moves nothing
    # at all -- without punishing one that is merely being careful.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # 0.35, up from 0.20. THIS TOLERANCE IS COMPARED AGAINST AMCL'S ESTIMATE,
      # NOT AGAINST THE WORLD, and that is the whole reason it has to be this
      # loose. Measured with r3 parked at the delivery standoff:
      #
      #     true pose     (-3.485, 10.988)   0.049 m from the goal
      #     AMCL estimate (-3.225, 11.024)   0.275 m from the goal
      #
      # The robot had arrived -- 5 cm out, heading within 0.012 rad -- and the
      # goal checker refused it, because AMCL's own 0.26 m residual put its
      # believed position just outside a 0.25 m circle. MPPI then nudged at the
      # goal line until the progress checker aborted, three times over, while
      # the robot sat still. A tolerance tighter than the localisation error is
      # not a precision setting, it is a deadlock.
      #
      # 0.26 m is ordinary for AMCL and not a defect to tune away, so the
      # tolerance accommodates it. Nothing downstream needs 20 cm anyway: at a
      # collection table claw_approach visually servos onto the rack from
      # wherever the robot stopped, and at the delivery table place_in_slot
      # re-reads the slot and calls _close_in_on when it is out of arm's reach.
      xy_goal_tolerance: 0.35
      # Loose heading tolerance: the robot doesn't need to nail an exact final
      # yaw (the visual servo re-centres on the box, and delivery/parking don't
      # care which way it faces). A tight yaw made the skid-steer oscillate in
      # place around the goal heading, which tripped Nav2's recovery Spin.
      yaw_goal_tolerance: 0.5

    # MPPI, NOT RegulatedPurePursuit. RPP follows a path; it does not choose
    # one. It has a single collision check along the carrot and its only
    # response to an obstacle is to slow down and eventually give up, which is
    # why obstacle handling in this fleet has been "Nav2 aborts, the mission
    # retries". MPPI rolls out a batch of candidate trajectories every cycle and
    # scores them against the costmap, so avoiding something is an ordinary
    # outcome of control rather than a failure of it -- and it stays that way
    # when the dynamic obstacles arrive, which RPP would not.
    #
    # SIZED FOR THREE ROBOTS ON ONE MACHINE. The defaults are batch_size 2000
    # and time_steps 56, and three of those at 20 Hz is not affordable here --
    # this fleet has already lost whole missions to nav2_lifecycle_manager
    # missing 2 s deadlines under load. 1000 x 36 keeps a 36 x 0.05 x 0.55 =
    # 0.99 m horizon, which is longer than the 0.55 m/s robot needs to stop.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 36
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      # vy is pinned to zero and stays there: this is a skid-steer, and the
      # DiffDrive motion model is what makes MPPI stop proposing sideways
      # motion it cannot execute.
      motion_model: "DiffDrive"
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.55
      vx_min: -0.35
      vy_max: 0.0
      wz_max: 1.9
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      regenerate_noises: false
      # Off deliberately: publishing candidate trajectories is a per-cycle
      # marker array per robot, and nothing reads it in a headless run.
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # CostCritic rather than ObstaclesCritic: it reads the costmap's own
      # inflation gradient, so the robot is pushed away from obstacles
      # continuously instead of only when a footprint check trips.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      # 10 Hz and 6 m square, up from 5 Hz and 4 m. MPPI rolls out a ~1 m
      # horizon 20 times a second and scores it against THIS grid, so a window
      # that only refreshes every 200 ms is the limiting factor on how late an
      # obstacle can appear and still be avoided. 6 m leaves margin around the
      # rollouts at the window edge; 120x120 cells is cheap.
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.25
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.45, up from 0.30. This is what gives Smac 2D's cost_travel_multiplier
        # and MPPI's CostCritic a gradient to work with -- at 0.30 the cost fell
        # to zero almost as soon as the robot cleared the obstacle, so "keep
        # clear of the wall" was not expressible.
        #
        # RAISING IT DOES NOT ENDANGER THE TIGHT STANDOFFS, which is the obvious
        # worry: what a planner refuses to enter is the INSCRIBED zone, and that
        # is set by robot_radius (0.25), not by this. Beyond 0.25 m inflation
        # only adds cost. The delivery standoff sits 0.70 m from the table's
        # lethal cells and stays traversable; measured on the running stack, the
        # cost there is 0.
        inflation_radius: 0.65 #0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.45, up from 0.30. This is what gives Smac 2D's cost_travel_multiplier
        # and MPPI's CostCritic a gradient to work with -- at 0.30 the cost fell
        # to zero almost as soon as the robot cleared the obstacle, so "keep
        # clear of the wall" was not expressible.
        #
        # RAISING IT DOES NOT ENDANGER THE TIGHT STANDOFFS, which is the obvious
        # worry: what a planner refuses to enter is the INSCRIBED zone, and that
        # is set by robot_radius (0.25), not by this. Beyond 0.25 m inflation
        # only adds cost. The delivery standoff sits 0.70 m from the table's
        # lethal cells and stays traversable; measured on the running stack, the
        # cost there is 0.
        inflation_radius: 0.65 #0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    # 5.0, matching what Smac 2D actually achieves on a 540x1160 costmap
    # (measured: 4.5 Hz). This is only the threshold for the 'planner loop
    # missed its rate' warning -- the behaviour tree replans at 1 Hz -- so
    # the old 20.0 bought nothing but a warning per plan.
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    # SmacPlanner2D, not NavFn. Both are grid planners and either can express
    # a differential-drive route -- a robot that turns in place has no
    # kinematic constraint for a planner to respect, which is also why the
    # Hybrid-A* and State Lattice planners are the wrong tools here: they exist
    # to honour a turning radius this robot does not have, and they cost
    # considerably more to run.
    #
    # What Smac 2D adds over NavFn is cost_travel_multiplier: it prices travel
    # through inflated cells, so the route keeps clearance from walls and
    # tables instead of shaving them the way NavFn's pure shortest path does.
    # That is the half of obstacle avoidance the controller cannot fix, because
    # by the time MPPI sees a path hugging a doorway its only options are all
    # bad ones.
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.7, 0.0, 2.2]
    min_velocity: [-0.7, 0.0, -2.2]
    max_accel: [1.5, 0.0, 3.5]
    max_decel: [-1.5, 0.0, -3.5]
    odom_topic: "/diff_drive_controller/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
