# Nav2 parameters for the pickplace_arm 4-wheel skid-steer mobile base.
#
# FOOTPRINT: the true 0.99 x 0.67 m Husky A200 rectangle, not a circle. It was a
# 0.25 m radius circle, described here as covering "the 0.38x0.26 m chassis plus
# the wheels" -- that is the PLACEHOLDER chassis this project used before the
# A200, and the value never moved with the robot. The A200 is more than twice
# as long and needs a 0.598 m circumscribed radius, so Nav2 was steering a robot
# less than half the size of the real one.
#
# In the open warehouse that never showed. In the hospital's 3 m corridor it
# does: carrying the sample rack to the ward, the base drove its front-right
# corner into a standing pedestrian and wedged there, with the controller
# aborting follow_path over and over (ground truth afterwards: base at world
# 6.17, 0.10, corner inside the pedestrian's footprint). A circle big enough to
# contain the A200 would instead refuse a third of that corridor and push the
# table/bench approach poses into inflated space, so the fix is the real
# polygon rather than a bigger circle.
#
# Uses the RegulatedPurePursuitController, which is robust for
# differential/skid-steer drives. SLAM (slam_toolbox) supplies map -> odom
# during mapping; the missions run AMCL instead.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_drive_controller/odom
    plugin_lib_names:
      - nav2_assisted_teleop_action_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_back_up_action_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_controller_selector_bt_node
      - nav2_distance_controller_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_get_pose_from_path_action_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_planner_selector_bt_node
      - nav2_progress_checker_selector_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_single_trigger_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_speed_controller_bt_node
      - nav2_spin_action_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_wait_cancel_bt_node
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    odom_topic: /diff_drive_controller/odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      # Loose heading tolerance: the robot doesn't need to nail an exact final
      # yaw (the visual servo re-centres on the box, and delivery/parking don't
      # care which way it faces). A tight yaw made the skid-steer oscillate in
      # place around the goal heading, which tripped Nav2's recovery Spin.
      yaw_goal_tolerance: 0.5

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.55
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.6
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.5
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # The A200 is 0.99 m long x 0.67 m wide. A circle cannot describe that
      # without either cutting the corners off or wasting a third of the
      # corridor, so the footprint is the actual rectangle, base_link at the
      # chassis origin (bumper at +0.494, tail at -0.496).
      footprint: "[[0.494, 0.335], [0.494, -0.335], [-0.496, -0.335], [-0.496, 0.335]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Must be >= the footprint's inscribed radius, which Nav2 computes
        # as 0.345 for this rectangle; below that it refuses to mark the
        # inscribed band and logs "smaller than the computed inscribed
        # radius ... to avoid collisions". 0.22 (carried over from the old
        # 0.25 m circle) did exactly that and left the robot unable to get
        # itself through the lab doorway at all.
        # Just above the 0.345 m inscribed radius Nav2 computes for the
        # footprint - the minimum it will accept. Anything much larger
        # squeezes the cost-0 lane through the 1.5 m doorways down to a
        # few cells, and NavFn then computes a legal potential but fails
        # to extract a path from it ("Failed to create a plan from
        # potential when a legal potential was found"), which is what 0.45
        # did. Hugging obstacles more closely is acceptable here because
        # the footprint is now the true rectangle, so the inscribed band
        # it leaves is real clearance rather than an under-estimate.
        inflation_radius: 0.36
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # The A200 is 0.99 m long x 0.67 m wide. A circle cannot describe that
      # without either cutting the corners off or wasting a third of the
      # corridor, so the footprint is the actual rectangle, base_link at the
      # chassis origin (bumper at +0.494, tail at -0.496).
      footprint: "[[0.494, 0.335], [0.494, -0.335], [-0.496, -0.335], [-0.496, 0.335]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Must be >= the footprint's inscribed radius, which Nav2 computes
        # as 0.345 for this rectangle; below that it refuses to mark the
        # inscribed band and logs "smaller than the computed inscribed
        # radius ... to avoid collisions". 0.22 (carried over from the old
        # 0.25 m circle) did exactly that and left the robot unable to get
        # itself through the lab doorway at all.
        # Just above the 0.345 m inscribed radius Nav2 computes for the
        # footprint - the minimum it will accept. Anything much larger
        # squeezes the cost-0 lane through the 1.5 m doorways down to a
        # few cells, and NavFn then computes a legal potential but fails
        # to extract a path from it ("Failed to create a plan from
        # potential when a legal potential was found"), which is what 0.45
        # did. Hugging obstacles more closely is acceptable here because
        # the footprint is now the true rectangle, so the inscribed band
        # it leaves is real clearance rather than an under-estimate.
        inflation_radius: 0.36
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.7, 0.0, 2.2]
    min_velocity: [-0.7, 0.0, -2.2]
    max_accel: [1.5, 0.0, 3.5]
    max_decel: [-1.5, 0.0, -3.5]
    odom_topic: "/diff_drive_controller/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
