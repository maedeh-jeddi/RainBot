# AMCL localization against maps/aws_hospital.yaml.
#
# EVERY TUNING VALUE HERE IS amcl_tugbot.yaml'S, UNCHANGED, AND THAT IS THE
# POINT. Localization was good in the warehouse run, and nothing physical about
# the robot differs here -- same chassis, same wheel friction, same IMU, same
# SICK LIDAR at the same 0.4466 m, same EKF fusing them into the same odom ->
# base_link. The only things that legitimately change with the world are WHERE
# the robot starts and WHICH map it matches against, so those are the only two
# things that differ below. Retuning the particle filter for a new building
# would be changing the one part of the system that was already working.
#
# THE MAP FRAME IS THE WORLD FRAME, EXACTLY. maps/aws_hospital.{pgm,yaml} are
# generated from aws_hospital.sdf's own collision geometry by aws_hospital_map.py
# rather than driven with SLAM, so there is no scan-matching drift between the
# two and no "mapping start pose" convention to remember: a Gazebo coordinate IS
# a map coordinate. That is what lets the initial pose below simply be the
# robot's spawn pose out of hospital_pickplace_layout.SPAWN.
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan

    # = hospital_pickplace_layout.SPAWN, i.e. gazebo.launch.py's SPAWN_X /
    # SPAWN_Y / SPAWN_YAW. These three must move together: seeding AMCL
    # somewhere the robot is not costs it the first few seconds of every run at
    # best, and locks it onto the wrong corridor at worst.
    set_initial_pose: true
    initial_pose:
      x: -4.0
      y: 8.0
      z: 0.0
      yaw: 1.5707963

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # likelihood_field_prob, not likelihood_field, FOR ONE REASON: it is the
    # only laser model in AMCL that can SKIP BEAMS, and this map is deliberately
    # incomplete in exactly the way beam skipping exists to handle.
    #
    # maps/aws_hospital.pgm is stamped from the building's collision geometry
    # plus the four static tables. The racks are deliberately NOT in it (see
    # hospital_mission.launch.py: "an obstacle where a prop no longer is, is
    # worse than one that was never drawn"), and neither are the other two
    # robots. So whenever a robot is at a table -- which is exactly where it
    # needs its pose to be good -- a chunk of its scan is returning off objects
    # the map does not contain, and plain likelihood_field weighs every one of
    # those beams as evidence against the correct pose.
    #
    # likelihood_field_prob computes a proper per-beam probability and, with
    # do_beamskip on, drops beams that most particles agree cannot be explained
    # by the map at all -- which is precisely the signature of an unmapped rack
    # or a second robot, and not of being in the wrong place. It costs slightly
    # more arithmetic per beam and is worth it here.
    #
    # This also prepares the ground for the dynamic obstacles that are still to
    # come: a moving person is the same problem as an unmapped rack, larger.
    # REQUIRED BY map_pump, not a preference. That node re-publishes /map
    # during bring-up so a robot whose subscription missed the single
    # latched sample still gets one -- and nav2_amcl does NOT ignore a
    # repeat: its map callback rebuilds the likelihood field and re-seeds
    # the particle filter from the initial pose. Without this flag the pump
    # would reset the localization of a robot half way through its errand.
    first_map_only: true
    laser_model_type: "likelihood_field_prob"
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    # 25.0, matching the LIDAR's own range in pickplace_arm.gazebo.xacro (see
    # the long note there). AMCL DISCARDS RETURNS BEYOND THIS VALUE, so leaving
    # it at the warehouse's 8.0 would throw away precisely the long beams that
    # make position along this building's 40.8 m corridor observable at all.
    # This is the one number here that is not amcl_tugbot.yaml's, besides the
    # map and the initial pose, and it changes what the filter is fed rather
    # than how it weighs it.
    laser_max_range: 25.0
    laser_min_range: 0.15
    # 90. THIS WAS RAISED TO 180 FOR A REASON THAT TURNED OUT NOT TO EXIST.
    #
    # The justification was a 2.4-2.8 m error "while driving" that collapsed at
    # every stop. That error was an artifact of the measuring tool, not the
    # filter: the ground truth came from `gz model -m <ns> -p`, which takes 5.1 s
    # per call, so a moving robot was being compared against a five-second-old
    # position and looked wrong by speed x 5 s. The giveaway was that amcl always
    # read AHEAD along the path -- a stale transform lags behind.
    #
    # Doubling the beams therefore bought nothing and cost a great deal:
    # likelihood_field_prob with beam skipping is the expensive model, and at 180
    # beams each robot's amcl sat at 50% of a core, 150% across the fleet, on a
    # machine whose bring-up was already failing for want of CPU.
    max_beams: 90
    min_particles: 500
    max_particles: 2000

    # motion noise (diff drive)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

    # likelihood field
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0

    # 0.18 / 0.20, RELAXED FROM 0.10 / 0.12, BECAUSE THE ERROR THEY WERE
    # TIGHTENED AGAINST DID NOT EXIST.
    #
    # The history here is worth keeping straight. These started at 0.25 / 0.25,
    # were halved to 0.05 / 0.05 and then set to 0.10 / 0.12, each step trying
    # to chase down a 2.4-2.8 m "driving error". That error was an artifact of
    # how it was being measured: `gz model -m <name> -p` takes 5.1-5.2 s per
    # call in this world, so comparing it against a fresh TF lookup made every
    # MOVING robot look mislocalised by speed x 5 s, in the direction of
    # travel, equally on all three. The tell was that AMCL always read AHEAD of
    # "truth" -- a stale TF would lag behind, so the stale sample had to be the
    # gz one. There was never a tracking problem for these numbers to fix.
    #
    # What they did cost is real. Each halving doubles how often the filter
    # runs, and a run is max_particles x max_beams -- up to 2000 x 90 beam
    # evaluations. At 0.12 m and the new 0.70 m/s that is 5.8 filter updates a
    # second per robot, 17 across the fleet. 0.20 m takes it to 3.5 and 10.
    #
    # 0.20 is not a return to the old 0.25: it still corrects five times over
    # the distance a metre of driving covers, it stays well inside the motion
    # the relocalize spin produces during recovery, and it is a fifth of the
    # 1.0 m scale at which this map's corridors become ambiguous. The genuine
    # errors in this project were all measured with the robot STATIONARY, where
    # `gz model -p` is trustworthy, and none of them were a function of how
    # often the filter ran.
    update_min_a: 0.18
    update_min_d: 0.20
    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    tf_broadcast: true
