# AMCL localization against maps/aws_hospital.yaml.
#
# EVERY TUNING VALUE HERE IS amcl_tugbot.yaml'S, UNCHANGED, AND THAT IS THE
# POINT. Localization was good in the warehouse run, and nothing physical about
# the robot differs here -- same chassis, same wheel friction, same IMU, same
# SICK LIDAR at the same 0.4466 m, same EKF fusing them into the same odom ->
# base_link. The only things that legitimately change with the world are WHERE
# the robot starts and WHICH map it matches against, so those are the only two
# things that differ below. Retuning the particle filter for a new building
# would be changing the one part of the system that was already working.
#
# THE MAP FRAME IS THE WORLD FRAME, EXACTLY. maps/aws_hospital.{pgm,yaml} are
# generated from aws_hospital.sdf's own collision geometry by aws_hospital_map.py
# rather than driven with SLAM, so there is no scan-matching drift between the
# two and no "mapping start pose" convention to remember: a Gazebo coordinate IS
# a map coordinate. That is what lets the initial pose below simply be the
# robot's spawn pose out of hospital_pickplace_layout.SPAWN.
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan

    # = hospital_pickplace_layout.SPAWN, i.e. gazebo.launch.py's SPAWN_X /
    # SPAWN_Y / SPAWN_YAW. These three must move together: seeding AMCL
    # somewhere the robot is not costs it the first few seconds of every run at
    # best, and locks it onto the wrong corridor at worst.
    set_initial_pose: true
    initial_pose:
      x: -4.0
      y: 8.0
      z: 0.0
      yaw: 1.5707963

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"
    # 25.0, matching the LIDAR's own range in pickplace_arm.gazebo.xacro (see
    # the long note there). AMCL DISCARDS RETURNS BEYOND THIS VALUE, so leaving
    # it at the warehouse's 8.0 would throw away precisely the long beams that
    # make position along this building's 40.8 m corridor observable at all.
    # This is the one number here that is not amcl_tugbot.yaml's, besides the
    # map and the initial pose, and it changes what the filter is fed rather
    # than how it weighs it.
    laser_max_range: 25.0
    laser_min_range: 0.15
    max_beams: 90
    min_particles: 500
    max_particles: 2000

    # motion noise (diff drive)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

    # likelihood field
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0

    update_min_a: 0.2
    update_min_d: 0.25
    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    tf_broadcast: true
