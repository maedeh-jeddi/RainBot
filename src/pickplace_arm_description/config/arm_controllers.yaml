# NODE KEYS ARE WILDCARDED (`/**/name` rather than `name`) so one file serves
# both the single robot at /controller_manager and a namespaced one at
# /r1/controller_manager. `/**` matches zero or more namespace levels, so the
# single-robot case still resolves - see the robot_ns notes in
# pickplace_arm.urdf.xacro.
#
# WITHOUT THIS, A NAMESPACED controller_manager COMES UP WITH NO PARAMETERS AT
# ALL and therefore knows the TYPE of no controller, so every spawner dies with
# a bare "Failed loading controller <name>" while the plugin itself logs a
# perfectly healthy start. Measured on the first three-robot run: all twelve
# spawners across r1, r2 and r3 died that way, which reads like a contention
# problem and is not one.
/**/controller_manager:
  ros__parameters:
    # 50 Hz, down from 100. This rate drives EVERY controller, and through
    # joint_state_broadcaster it also sets how fast /joint_states -- and
    # therefore robot_state_publisher's whole TF tree -- is republished. With
    # three robots that is three times ~30 frames, and every move_group, costmap
    # and mission node in the system deserialises all of it. Halving it halves
    # that traffic outright.
    #
    # Nothing here needs 100 Hz: the arm follows joint-trajectory waypoints, the
    # diff drive integrates wheel odometry that the EKF then fuses at its own
    # rate, and the grasp check reads a finger position that moves over hundreds
    # of milliseconds. Raise it back if arm tracking ever looks coarse.
    # 25 Hz, down from 50. THIS IS THE /tf RATE, and /tf is the single
    # biggest load on this machine.
    #
    # joint_state_broadcaster publishes once per controller_manager update, and
    # robot_state_publisher turns every one of those into a /tf message. /tf has
    # 12 publishers and 29 SUBSCRIBERS, so each message is serialised and
    # delivered 29 times through the loopback network stack -- which is why
    # three robot_state_publishers sit at ~57% of a core each and why 39% of ALL
    # cpu on this machine is kernel time.
    #
    # Halving the rate halves that traffic. 25 Hz is still ahead of every
    # consumer: Nav2's controller runs at 20 Hz and the base now tops out at
    # 1.0 m/s, i.e. 4 cm per controller cycle. That is the number to watch if
    # the base is ever asked to go faster again - at some point the wheel
    # command becomes the coarse thing rather than the TF traffic.
    update_rate: 25  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# Explicit joint list, ONLY because of the mimic finger.
#
# gz_ros2_control deliberately registers a mimic joint's state/command
# interfaces under "<joint_name>_mimic" (gz_system.cpp: `suffix = "_mimic"`),
# so left to its default "publish everything available" mode the broadcaster
# emits a joint named `fr3_finger_joint2_mimic` on /joint_states. That name
# exists in NO robot model, and move_group logs
#   "Joint 'fr3_finger_joint2_mimic' not found in model 'pickplace_arm'"
# once per message. Listing the real joints here drops it.
#
# Nothing is lost by omitting fr3_finger_joint2 itself: it is a <mimic> of
# fr3_finger_joint1 in the URDF, and BOTH consumers reconstruct it rather than
# needing it on the wire - robot_state_publisher derives the mimic transform
# (verified: publishing only finger_joint1=0.04 moves fr3_rightfinger to
# y=-0.04), and MoveIt derives it in its own model. Gazebo still physically
# drives the joint via gz_ros2_control's mimic handling, which is independent
# of what this broadcaster publishes.
#
# joint_state_broadcaster only leaves its "all available interfaces" mode when
# `joints` AND `interfaces` are BOTH set, so both are required here.
/**/joint_state_broadcaster:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
      - fr3_finger_joint1
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    interfaces:
      - position
      - velocity

/**/arm_controller:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
/**/gripper_controller:
  ros__parameters:
    # Only finger_joint1. fr3_finger_joint2 mimics it (declared with
    # mimic/multiplier params in pickplace_arm.gazebo.xacro); listing it here
    # too would have the controller and the mimic both driving one joint.
    joints:
      - fr3_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
/**/diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]
    # Husky A200 geometry, from clearpath_platform_description's a200.urdf.xacro:
    #   track  0.555  (wheel separation)
    #   wheel_radius 0.1651, wheelbase 0.512
    wheel_separation: 0.555
    wheels_per_side: 2
    wheel_radius: 0.1651
    # Skid-steer scrub correction: a 4-wheel skid-steer physically rotates
    # less than the 2-wheel diff-drive odom model predicts (the fore/aft wheels
    # scrub sideways), so the effective track is inflated by this factor to
    # make odom yaw match reality.
    #
    # NEEDS RECALIBRATION. 1.46 was measured on the old placeholder chassis
    # (wheelbase 0.24 / track 0.30). The A200's footprint is far squarer
    # (wheelbase 0.512 / track 0.555), so its scrub behaviour differs; 1.46 is
    # carried over only as a starting point. Recalibrate the same way as
    # before: rotate in place and compare odom yaw against Gazebo ground truth.
    wheel_separation_multiplier: 1.46
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]
    open_loop: false
    # The robot_localization EKF publishes odom->base_link (fusing this wheel
    # odom with the IMU), so the controller must not also publish that TF.
    enable_odom_tf: false
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    # THE HARDWARE CEILING FOR THE WHOLE STACK, and it was set below the real
    # robot's. Clearpath's own A200 hardware interface declares max_speed 1.0
    # and max_accel 5.0 (the non-sim branch of a200.urdf.xacro's ros2_control
    # block, which this sim twin shadows), so 0.8 / 1.5 was a self-imposed cap
    # rather than the base's. Nav2 was then asked to stay under THAT, which is
    # how every drive in a 29-40 m errand ended up at 0.70 m/s.
    #
    # The three limiters have to stay ordered - MPPI 0.90/2.2 asks, the velocity
    # smoother 0.90/2.4 passes on, this 1.00/2.5 executes - so that no layer
    # silently clips a command the layer above planned. See the note in
    # nav2_params.yaml's velocity_smoother block.
    #
    # 2.5 m/s^2 is a quarter of what traction allows: the wheels carry mu 1.0 in
    # pickplace_arm.gazebo.xacro, i.e. roughly 9.8 m/s^2 before slip. The real
    # constraint is not grip, it is that a skid-steer which slips corrupts the
    # wheel odometry the EKF is fusing - which is what wheel_separation_multiplier
    # below exists to correct - so this stays well inside the limit.
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: true
        max_acceleration: 2.5
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 2.5
        has_acceleration_limits: true
        max_acceleration: 6.0
